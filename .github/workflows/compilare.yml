# La fiecare push verificam ca toate programele se compileaza (cu bibliotecile din Library Manager)
name: Compilare

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  casa:
    name: Arduino Uno (casa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: arduino:avr:uno
          sketch-paths: casa
          enable-warnings-report: true
          libraries: |
            - name: rc-switch
            - name: OneWire

  panou:
    name: ESP32 cu ecran (panou)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: panou
          libraries: |
            - name: LovyanGFX
            - name: ArduinoJson
            - name: PubSubClient

  gradina:
    name: ESP32-S3 din gradina
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: gradina
