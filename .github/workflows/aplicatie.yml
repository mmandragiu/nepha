# Aplicatia de telefon: la fiecare push in aplicatie/ o verificam si facem APK-ul de Android.
# Pentru iPhone ne trebuie un Mac, asa ca o facem pe un Mac de la GitHub, doar cand o cerem noi
# (Actions -> Aplicatia -> Run workflow, bifat "iPhone"): minutele de Mac se consuma de 10 ori mai repede.
name: Aplicatia

on:
  push:
    paths:
      - 'aplicatie/**'
      - '.github/workflows/aplicatie.yml'
  workflow_dispatch:
    inputs:
      iphone:
        description: 'Fa si aplicatia de iPhone (.ipa)'
        type: boolean
        default: true

jobs:
  android:
    name: Verificare + APK Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aplicatie
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # APK-ul de pe GitHub e doar pentru verificare: fara parola brokerului (merge doar pe Wi-Fi).
      # Cel adevarat il facem pe laptop, cu secrete.json (vezi aplicatie/README.md).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v5
        with:
          name: NEPHA-android
          path: aplicatie/build/app/outputs/flutter-apk/app-release.apk

  iphone:
    name: Aplicatia de iPhone (fara semnatura)
    if: github.event_name == 'workflow_dispatch' && inputs.iphone
    runs-on: macos-latest
    defaults:
      run:
        working-directory: aplicatie
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.5
          channel: stable
          cache: true
      - run: flutter pub get
      # fara semnatura: o semnam la instalare (Sideloadly cu Apple ID-ul nostru) - vezi aplicatie/README.md
      # Parola brokerului vine din seiful repo-ului (Settings -> Secrets -> Actions), nu din cod.
      # Fara ea, aplicatia de iPhone merge doar pe Wi-Fi.
      # (prin variabile, ca o parola cu $, spatii sau ghilimele sa ajunga intocmai)
      - env:
          MQTT_UTILIZATOR: ${{ secrets.MQTT_UTILIZATOR }}
          MQTT_PAROLA: ${{ secrets.MQTT_PAROLA }}
        run: >-
          flutter build ios --release --no-codesign
          --dart-define="MQTT_UTILIZATOR=$MQTT_UTILIZATOR"
          --dart-define="MQTT_PAROLA=$MQTT_PAROLA"
      - name: Facem .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr NEPHA.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: NEPHA-iphone
          path: aplicatie/NEPHA.ipa
